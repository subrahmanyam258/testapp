name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Publishable (public-by-design) Supabase values for the Safar project
      VITE_SUPABASE_URL: https://oklgbjxakhnfxhellift.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_N66C0CbZD82gr9J8-5XT6Q_04qO1vO-
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm i --no-save @capacitor/core @capacitor/cli @capacitor/android
      - run: npm run build
      - run: npx cap add android
      - name: Fix duplicate Kotlin classes (old stdlib-jdk7/jdk8 are merged into kotlin-stdlib 1.8+)
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          GRADLE
      - name: Hum Safar launcher icon
        run: |
          cp -r android-res/. android/app/src/main/res/
          sed -i 's/#FFFFFF/#0B6E6E/I' android/app/src/main/res/values/ic_launcher_background.xml
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HumSafar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to a public download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HumSafar.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HumSafar.apk --target "$GITHUB_SHA" \
            --title "Hum Safar (latest build)" --notes "Debug APK built from commit $GITHUB_SHA"
